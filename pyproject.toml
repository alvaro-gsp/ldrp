[project]
name = "ldrp"
version = "1.0.0"
description = "Local network file sharing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ldrp = "ldrp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ldrp"]
